# The API is routed by the Ingress (/api → api service). This server only serves static files.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;   # the builder iframe is same-origin
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Inline style attributes are used by the builder's rendered form; scripts are self-hosted only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /builder.html { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location /downloads/ { add_header Content-Disposition "attachment" always; try_files $uri =404; }

  # Local testing only: this container also proxies the API, a job the Ingress does in Kubernetes.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /healthz { access_log off; return 200 "ok\n"; }
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
