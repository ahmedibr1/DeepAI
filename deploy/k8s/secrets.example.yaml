# Example only — create the real Secret out of band (Rancher UI, Sealed Secrets, or External Secrets Operator).
# Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: presales-portal-secrets
type: Opaque
stringData:
  # With CloudNativePG, take the password from the generated secret "<release>-presales-portal-db-app".
  PORTAL_DATABASE_URL: postgresql+psycopg://portal:<password>@<release>-presales-portal-db-rw:5432/portal?sslmode=require
  PORTAL_JWT_SECRET: <python -c "import secrets; print(secrets.token_urlsafe(48))">
