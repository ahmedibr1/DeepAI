{{- if .Values.ai.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pp.fullname" . }}-embeddings
  labels:
    {{- include "pp.labels" . | nindent 4 }}
    app.kubernetes.io/component: embeddings
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      {{- include "pp.selector" (dict "root" . "component" "embeddings") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pp.selector" (dict "root" . "component" "embeddings") | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.ai.gpuNodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - name: embeddings
          image: {{ include "pp.image" (dict "root" . "image" .Values.ai.embeddings.image) }}
          args:
            - --model=/models/{{ .Values.ai.embeddings.model }}
            - --task=embed
            - --gpu-memory-utilization={{ .Values.ai.embeddings.gpuMemoryUtilization }}
            - --host=0.0.0.0
            - --port=8000
          env: [{ name: HF_HUB_OFFLINE, value: "1" }, { name: VLLM_NO_USAGE_STATS, value: "1" }]
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15, failureThreshold: 40 }
          resources:
            {{- toYaml .Values.ai.embeddings.resources | nindent 12 }}
          volumeMounts: [{ name: models, mountPath: /models, readOnly: true }]
      volumes:
        - { name: models, persistentVolumeClaim: { claimName: {{ include "pp.fullname" . }}-models } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pp.fullname" . }}-embeddings
spec:
  selector:
    {{- include "pp.selector" (dict "root" . "component" "embeddings") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
---
# AI orchestrator / ingestion worker (Phase 3): claims jobs from PostgreSQL (SELECT … FOR UPDATE SKIP LOCKED),
# extracts documents, embeds chunks into pgvector, calls the LLM, validates JSON, writes immutable results.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pp.fullname" . }}-ai-worker
  labels:
    {{- include "pp.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-worker
spec:
  replicas: {{ .Values.ai.worker.replicas }}
  selector:
    matchLabels:
      {{- include "pp.selector" (dict "root" . "component" "ai-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pp.selector" (dict "root" . "component" "ai-worker") | nindent 8 }}
    spec:
      {{- include "pp.podSecurity" . | nindent 6 }}
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: {{ include "pp.image" (dict "root" . "image" .Values.api.image) }}
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: {{ include "pp.fullname" . }}-api }
            - secretRef: { name: {{ .Values.api.existingSecret }} }
          env:
            - { name: PORTAL_LLM_BASE_URL, value: "http://{{ include "pp.fullname" . }}-llm:8000/v1" }
            - { name: PORTAL_LLM_MODEL, value: {{ .Values.ai.llm.servedModelName | quote }} }
            - { name: PORTAL_EMBEDDINGS_BASE_URL, value: "http://{{ include "pp.fullname" . }}-embeddings:8000/v1" }
            - { name: PORTAL_EMBEDDINGS_MODEL, value: {{ .Values.ai.embeddings.model | quote }} }
            - { name: PORTAL_STORAGE_BACKEND, value: {{ .Values.documents.backend | quote }} }
            {{- if eq .Values.documents.backend "local" }}
            - { name: PORTAL_LOCAL_STORAGE_PATH, value: /var/lib/portal/documents }
            {{- end }}
          {{- include "pp.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq .Values.documents.backend "local" }}
            - { name: documents, mountPath: /var/lib/portal/documents, readOnly: true }
            {{- end }}
          resources:
            {{- toYaml .Values.ai.worker.resources | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if eq .Values.documents.backend "local" }}
        - { name: documents, persistentVolumeClaim: { claimName: {{ include "pp.fullname" . }}-documents } }
        {{- end }}
{{- end }}
