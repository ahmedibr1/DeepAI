# One-command local test of Phase 1: database, API and web.
#
#   docker compose up --build           (first run takes a few minutes)
#   open http://localhost:8080
#   sign in as admin / FirstAdmin2026, then set your own password
#
#   docker compose down                 stop, keep the data
#   docker compose down -v              stop and delete the data
#
# Development convenience only: the passwords below are fixed and the site is plain HTTP.
# Use the Helm chart with TLS and real secrets for anything beyond testing.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes: [portal-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m scripts.bootstrap_admin"
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      PORTAL_JWT_SECRET: local-development-secret-not-for-production-use
      PORTAL_BOOTSTRAP_ADMIN_USERNAME: admin
      PORTAL_BOOTSTRAP_ADMIN_PASSWORD: FirstAdmin2026
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment:
      PORTAL_ENVIRONMENT: development
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      PORTAL_JWT_SECRET: local-development-secret-not-for-production-use
      PORTAL_COOKIE_SECURE: "false"      # the test site is plain HTTP
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    ports: ["8080:8080"]
    volumes:
      - ./deploy/local/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  portal-db:
