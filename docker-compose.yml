# One-command local test of Phase 1: database, API and web.
#
#   docker compose up --build           (first run takes a few minutes)
#   open http://localhost:8080
#   sign in as admin / FirstAdmin2026, then set your own password
#
#   docker compose down                 stop, keep the data
#   docker compose down -v              stop and delete the data
#
# Development convenience only: the passwords below are fixed and the site is plain HTTP.
# Use the Helm chart with TLS and real secrets for anything beyond testing.
#
# AI (Retrieval-Augmented Generation)
#   Without a GPU, AI analysis runs the rule-based demo analyst (PORTAL_LLM_PROVIDER=demo) so the whole flow
#   works end to end, but nothing is generated by a model and retrieval uses hashed vectors.
#   With an NVIDIA GPU, run real models with vLLM:
#     cp deploy/local/ai-gpu.env.example .env      # points the API and worker at the model services
#     docker compose --profile gpu up --build
#   The first start downloads the model weights into the hf-cache volume.
# AI settings shared by the API and the worker. Defaults run without a GPU; .env overrides them.
x-ai-env: &ai-env
  PORTAL_LLM_PROVIDER: ${PORTAL_LLM_PROVIDER-demo}
  PORTAL_LLM_BASE_URL: ${PORTAL_LLM_BASE_URL-}
  PORTAL_LLM_MODEL: ${PORTAL_LLM_MODEL-deepdive-llm}
  PORTAL_EMBEDDINGS_BASE_URL: ${PORTAL_EMBEDDINGS_BASE_URL-}
  PORTAL_EMBEDDINGS_MODEL: ${PORTAL_EMBEDDINGS_MODEL-Qwen/Qwen3-Embedding-4B}
  PORTAL_RERANK_BASE_URL: ${PORTAL_RERANK_BASE_URL-}
  PORTAL_RERANK_MODEL: ${PORTAL_RERANK_MODEL-BAAI/bge-reranker-v2-m3}
  PORTAL_STORAGE_BACKEND: local
  PORTAL_LOCAL_STORAGE_PATH: /var/lib/portal/documents

services:
  db:
    image: pgvector/pgvector:pg16      # Postgres 16 with the pgvector extension AI retrieval needs
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes: [portal-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m scripts.bootstrap_admin"
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      PORTAL_JWT_SECRET: local-development-secret-not-for-production-use
      PORTAL_BOOTSTRAP_ADMIN_USERNAME: admin
      PORTAL_BOOTSTRAP_ADMIN_PASSWORD: FirstAdmin2026
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment:
      PORTAL_ENVIRONMENT: development
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      PORTAL_JWT_SECRET: local-development-secret-not-for-production-use
      PORTAL_COOKIE_SECURE: "false"      # the test site is plain HTTP
      <<: *ai-env
    volumes: [portal-documents:/var/lib/portal/documents]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # Runs the AI jobs the API queues: ingest (extract, chunk, embed) and analyze (retrieve, prompt, validate).
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:portal@db:5432/portal
      PORTAL_JWT_SECRET: local-development-secret-not-for-production-use
      <<: *ai-env
    volumes: [portal-documents:/var/lib/portal/documents]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # --- Models (only with: docker compose --profile gpu up) -------------------------------------------
  llm:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.11.0
    command: ["--model=${LLM_MODEL:-Qwen/Qwen3-8B}", "--served-model-name=deepdive-llm",
              "--max-model-len=${LLM_MAX_LEN:-32768}", "--gpu-memory-utilization=${LLM_GPU_SHARE:-0.70}",
              "--enable-prefix-caching", "--host=0.0.0.0", "--port=8000"]
    volumes: [hf-cache:/root/.cache/huggingface]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  embeddings:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.11.0
    # Served under the same name the worker requests; vectors are truncated to 1024 dims to match the database.
    command: ["--model=${EMBEDDINGS_MODEL:-Qwen/Qwen3-Embedding-4B}", "--served-model-name=${EMBEDDINGS_MODEL:-Qwen/Qwen3-Embedding-4B}",
              "--task=embed", "--gpu-memory-utilization=${EMBEDDINGS_GPU_SHARE:-0.12}", "--host=0.0.0.0", "--port=8000"]
    volumes: [hf-cache:/root/.cache/huggingface]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  reranker:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.11.0
    command: ["--model=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}", "--served-model-name=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}",
              "--task=score", "--gpu-memory-utilization=${RERANK_GPU_SHARE:-0.06}", "--host=0.0.0.0", "--port=8000"]
    volumes: [hf-cache:/root/.cache/huggingface]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  web:
    build: ./frontend
    ports: ["8080:8080"]
    volumes:
      - ./deploy/local/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]

volumes:
  portal-db:
  portal-documents:     # shared by the API (uploads) and the worker (reads them to build the AI corpus)
  hf-cache:             # downloaded model weights
